name: Update preview download

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: latest-preview
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'patrickshao/Decky-Framegen' && (github.event_name != 'release' || github.event.release.tag_name != 'latest-preview')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify published ZIP and update the preview link
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/publish_preview.py
