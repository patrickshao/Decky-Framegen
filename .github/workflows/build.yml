name: Build Lite plugin

on:
  push:
    branches: [main, fsr4-lite]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install build tools
        run: |
          npm install --global pnpm@10.28.2 --ignore-scripts
          sudo apt-get update
          sudo apt-get install --yes libarchive-tools
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Check source
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m py_compile main.py defaults/assets/patch-game.py scripts/fetch_assets.py scripts/package.py
          bash -n defaults/assets/fgmod.sh defaults/assets/fgmod-uninstaller.sh
          pnpm exec tsc --noEmit
      - name: Build frontend
        run: pnpm build
      - name: Fetch and verify official runtime files
        run: python3 scripts/fetch_assets.py
      - name: Package plugin
        run: python3 scripts/package.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Decky-Framegen-Lite
          path: |
            out/Decky-Framegen-*.zip
            out/Decky-Framegen-*.zip.sha256
          if-no-files-found: error
